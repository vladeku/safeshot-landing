<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #3CB6CE 0%, #197894 70%, #125B6F 100%);
    color: #fff; position: relative;
  }
  .glow { position: absolute; left: -120px; top: -260px; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 62%); }
  .icon { position: absolute; left: 88px; top: 143px; width: 344px; height: 344px;
    filter: drop-shadow(0 30px 50px rgba(6,40,50,.38)); }
  .text { position: absolute; left: 500px; top: 150px; right: 80px; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -.035em; line-height: 1; margin-top: 12px; }
  p { font-size: 34px; font-weight: 500; letter-spacing: -.01em; line-height: 1.22; margin-top: 22px; max-width: 600px; }
  .url { position: absolute; left: 500px; bottom: 74px; font-size: 26px; font-weight: 600; opacity: .9; letter-spacing: -.01em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="icon" src="../press/assets/icon/SafeShot-Icon-1024.png" alt="">
  <div class="text">
    <div class="eyebrow">Press kit</div>
    <h1>SafeShot</h1>
    <p>Cover what you didn't mean to share.</p>
  </div>
  <div class="url">getsafeshot.app/press</div>
</body>
</html>
